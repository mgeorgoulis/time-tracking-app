<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Tracking App</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <main class="app-shell">
        <section id="login-view" class="card login-card">
            <h1>Time Tracking App</h1>
            <p class="subtitle">Arbeitszeiterfassung</p>

            <label for="user-id-input">Benutzer-ID</label>
            <input id="user-id-input" type="number" value="1" />

            <label for="pin-input">PIN</label>
            <input id="pin-input" type="password" placeholder="9999" />

            <button id="login-button">Einloggen</button>

            <p id="login-error" class="error-message"></p>
            <p class="hint">Demo-Admin: Benutzer-ID 1, PIN 9999</p>
        </section>

        <section id="dashboard-view" class="hidden">
            <header class="topbar">
                <div>
                    <h1>Dashboard</h1>
                    <p id="user-info" class="subtitle"></p>
                </div>
                <button id="logout-button" class="secondary-button">Logout</button>
            </header>

            <section class="grid">
                <article class="card">
                    <h2>Status</h2>
                    <p id="status-text" class="status-text">Nicht eingestempelt</p>

                    <div class="button-group">
                        <button id="clock-in-button">Einstempeln</button>
                        <button id="break-button" class="secondary-button">30 Min. Pause</button>
                        <button id="clock-out-button" class="danger-button">Ausstempeln</button>
                    </div>

                    <p id="action-message" class="message"></p>
                </article>

                <article class="card">
                    <h2>Monatsbericht</h2>

                    <div class="form-row">
                        <label for="report-year-input">Jahr</label>
                        <input id="report-year-input" type="number" />
                    </div>

                    <div class="form-row">
                        <label for="report-month-input">Monat</label>
                        <input id="report-month-input" type="number" min="1" max="12" />
                    </div>

                    <div class="form-row">
                        <label for="expected-minutes-input">Soll-Minuten</label>
                        <input id="expected-minutes-input" type="number" value="480" />
                    </div>

                    <button id="load-report-button">Monatsbericht laden</button>
                </article>
            </section>

            <section class="card">
                <h2>Bericht</h2>
                <pre id="report-output" class="report-box">Noch kein Bericht geladen.</pre>
            </section>

            <section class="card">
                <div class="section-header">
                    <h2>Audit-Log</h2>
                    <button id="load-audit-log-button" class="secondary-button">Audit-Log laden</button>
                </div>
                <ul id="audit-log-list" class="audit-log-list"></ul>
                <p id="audit-log-message" class="message"></p>
            </section>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
