<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Time Tracking App</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <h1>Time Tracking App</h1>
            <p class="subtitle">Arbeitszeiterfassung</p>

            <form id="login-form">
                <label for="user-id-input">Benutzer-ID</label>
                <input id="user-id-input" type="number" min="1" autocomplete="off" />

                <label for="pin-input">PIN</label>
                <input id="pin-input" type="password" maxlength="4" placeholder="PIN" autocomplete="off" />

                <button id="login-button" type="submit">Einloggen</button>
            </form>

            <p id="login-message" class="message"></p>
        </section>
    </main>

    <script src="js/apiClient.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
