<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Benutzerprofil | Time Tracking App</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-locked">
    <main class="page-container">
        <header class="page-header">
            <div>
                <h1>Benutzerprofil</h1>
                <p id="user-info" class="subtitle"></p>
            </div>
        </header>

        <nav id="management-nav" class="management-nav"></nav>

        <section class="card">
            <div class="section-header">
                <div>
                    <h2 id="profile-title">Profil wird geladen...</h2>
                    <p id="profile-subtitle" class="form-hint"></p>
                </div>

                <a class="secondary-link" href="users.html">Zurück zur Benutzerliste</a>
            </div>

            <div id="profile-fields" class="profile-fields"></div>

            <p id="profile-message" class="message"></p>
        </section>

        <section class="card">
            <h2>PIN zurücksetzen</h2>
            <p class="form-hint">
              Geben sie einen neuen PIN für den Mitarbeiter ein und drücken sie dann den Button 'PIN zurücksetzen'. <br>  Der Benutzer wird beim nächsten Login aufgefordert einen neuen PIN zu wählen.
            </p>

            <label for="reset-pin-input">Neuer Start-PIN</label>
            <input id="reset-pin-input" type="password" maxlength="4" />

            <button id="reset-pin-button" class="secondary-button">PIN zurücksetzen</button>
            <p id="reset-pin-message" class="message"></p>
        </section>
    </main>

    <script src="js/apiClient.js"></script>
    <script src="js/roles.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/userProfile.js"></script>
</body>
</html>
