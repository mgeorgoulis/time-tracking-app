<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Benutzerverwaltung | Time Tracking App</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-locked">
    <main class="page-container">
        <header class="page-header">
            <div>
                <h1>Benutzerverwaltung</h1>
                <p id="user-info" class="subtitle"></p>
            </div>
        </header>

        <nav id="management-nav" class="management-nav"></nav>

        <section class="card">
            <div class="section-header">
                <div>
                    <h2>Benutzerliste</h2>
                    <p class="form-hint">
                        Hier werden alle im System hinterlegten Benutzer angezeigt.
                    </p>
                </div>

                <button id="refresh-users-button" class="secondary-button">Benutzer aktualisieren</button>
            </div>

            <div id="users-table-wrapper" class="table-wrapper">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>Personal-ID</th>
                            <th>Name</th>
                            <th>Rolle</th>
                            <th>Abteilung</th>
                            <th>E-Mail</th>
                            <th>Status</th>
                            <th>PIN-Wechsel</th>
                            <th>Aktion</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body"></tbody>
                </table>
            </div>

            <p id="users-message" class="message"></p>
        </section>
    </main>

    <script src="js/apiClient.js"></script>
    <script src="js/roles.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/users.js"></script>
</body>
</html>
